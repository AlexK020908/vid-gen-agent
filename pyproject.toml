[project]
name = "stickfleet"
version = "0.1.0"
description = "Idea in, narrated stick-figure YouTube video out, with human gates."
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pillow>=11.0",
    "imageio-ffmpeg>=0.6",
    "python-dotenv>=1.0",
    "tzdata",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "keyring>=25.7.0",
    "anthropic>=2.3.0",
    "fal-client>=1.0.3",
    "httpx2>=2.16.0",
    "mcp==2.3.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not live'"
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY); run with `pytest -m live`"]
